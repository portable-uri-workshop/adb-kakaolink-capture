name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact Android toolchain
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkmanager)) { throw "sdkmanager missing: $sdkmanager" }
          & $sdkmanager "platforms;android-36" "build-tools;36.1.0"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed: $LASTEXITCODE" }
      - name: Test in Windows PowerShell 5.1
        shell: powershell
        run: .\test.ps1
      - name: Test in PowerShell 7
        shell: pwsh
        run: .\test.ps1
      - name: Build DEX JAR in Windows PowerShell 5.1
        shell: powershell
        run: .\build.ps1
      - name: Verify generated JAR and async writer
        shell: pwsh
        run: |
          $entries = @(jar tf .\out\adb-intent-capture.jar)
          if ($entries -notcontains 'classes.dex') { throw 'classes.dex missing from JAR' }
          $dexdump = Join-Path $env:ANDROID_HOME 'build-tools\36.1.0\dexdump.exe'
          $descriptors = & $dexdump -f .\temp\build\dex\classes.dex |
            Select-String 'Class descriptor' |
            ForEach-Object { $_.Line.Trim() }
          $descriptors | Out-Host
          if (-not ($descriptors -match 'IntentCaptureMonitor')) { throw 'Monitor class missing' }
          if (-not ($descriptors -match 'CaptureWriter')) { throw 'Async writer missing' }
          if (-not ($descriptors -match 'LaunchDecision')) { throw 'Policy class missing' }
          if ($descriptors -match 'Landroid/app/IActivityController') { throw 'Compile-only stub leaked into DEX' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adb-kakaolink-capture-prebuilt
          path: out/adb-intent-capture.jar
          if-no-files-found: error
